# Acceptance gate: run the automated suite (tests/, including
# tests/test_library.py) on every push and pull request. Reuses the
# documented test command from README.md:
#   python -m unittest discover -s tests -p "test_*.py"
name: tests

on:
  push:
  pull_request:

jobs:
  python:
    # Windows matches the portable Tauri desktop platform contract.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install the project environment
        run: uv sync --locked
      - name: Run the tests/ suite
        run: uv run python -m unittest discover -s tests -p "test_*.py"

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install the locked sidecar build environment
        run: uv sync --locked --group build
      - name: Install the desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Lint, typecheck, and test the desktop frontend
        working-directory: desktop
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Test and lint the Rust host
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --release --all-targets --all-features -- -D warnings
      - name: Build and smoke-test the portable desktop
        shell: pwsh
        run: |
          .\scripts\build_portable.ps1
          .\scripts\test_portable_smoke.ps1
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemeSort-portable
          path: dist/MemeSort-portable.zip
          if-no-files-found: error
