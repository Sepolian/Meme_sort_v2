name: tests

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install the project environment
        run: uv sync --locked
      - name: Run the tests/ suite
        run: uv run python -m unittest discover -s tests -p "test_*.py"

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MemeSort-portable
          - os: macos-15
            artifact: MemeSort-macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        run: |
          uv sync --locked --group build
          npm ci --prefix desktop
      - name: Build and smoke-test the Apple Silicon app
        if: runner.os == 'macOS'
        run: bash scripts/build_macos.sh
      - name: Lint, typecheck, and test the desktop frontend
        working-directory: desktop
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Test and lint the Rust host
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --release --all-targets --all-features -- -D warnings
      - name: Build and smoke-test the Windows portable desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\build_portable.ps1
          .\scripts\test_portable_smoke.ps1
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
