[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-sort-worker"
version = "0.1.0"
description = "Local worker foundation for MemeSort Milestone 1"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    # Native desktop window backend. Windows-only, matching the project's
    # platform contract; it drives the Evergreen WebView2 runtime and pulls the
    # pythonnet-based backend on Windows automatically.
    "pywebview>=5.0 ; sys_platform == 'win32'",
]

[project.scripts]
memesort-worker = "memesort_worker.cli:main"

[project.gui-scripts]
memesort-desktop = "memesort_worker.desktop_entry:main"

[tool.setuptools]
packages = ["memesort_worker"]
